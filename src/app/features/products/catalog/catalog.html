<h1>Catálogo de Productos</h1>

@if (notice(); as text) {
  <p class="notice" role="status">{{ text }}</p>
}

<app-search-form
  placeholder="Buscar por nombre o descripción..."
  (onSearch)="setSearch($event)"
/>

<app-category-filter
  [categories]="categories()"
  [selectedCategory]="selectedCategory()"
  (onCategoryChange)="setCategory($event)"
/>

<app-product-grid
  [products]="products()"
  [loading]="loading()"
  [error]="error()"
  [hasMore]="hasMore()"
  (onLoadMore)="loadMore()"
  (onRetry)="loadMore()"
  (onAdd)="addToCart($event)"
/>
