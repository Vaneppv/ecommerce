<h1>Productos</h1>

@if (notice(); as text) {
  <p class="notice" role="status">{{ text }}</p>
}

<app-search-form
  placeholder="Buscar productos..."
  (onSearch)="setSearch($event)"
/>

<app-category-filter
  [categories]="['belleza', 'electrónica', 'hogar', 'ropa', 'deportes']"
  (onCategoryChange)="setCategory($event)"
/>

<app-product-grid
  [products]="products()"
  [loading]="loading()"
  [error]="error()"
  [hasMore]="hasMore()"
  (onLoadMore)="loadMore()"
  (onRetry)="loadMore()"
  (onAdd)="addToCart($event)"
/>
