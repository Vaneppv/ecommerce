<header class="catalog-header">
  <p class="eyebrow">Tienda</p>
  <h1>Productos</h1>
  <p class="catalog-subtitle">Encuentra productos para tu día a día.</p>
</header>

@if (notice(); as text) {
  <p class="notice" role="status">{{ text }}</p>
}

<section class="catalog-controls" aria-label="Filtrar productos">
  @if (searchTerm()) {
    <p class="active-search" role="status">
      Resultados para <strong>“{{ searchTerm() }}”</strong>
      <button type="button" class="clear-search" (click)="clearSearch()">
        Limpiar búsqueda
      </button>
    </p>
  }

  <div class="category-heading">
    <span>Categorías</span>
    @if (selectedCategory().toLowerCase() !== 'todas') {
      <button type="button" class="clear-filters" (click)="setCategory('todas')">Ver todas</button>
    }
  </div>

  <app-category-filter
    [categories]="categories()"
    [selectedCategory]="selectedCategory()"
    (onCategoryChange)="setCategory($event)"
  />
</section>

<app-product-grid
  [products]="products()"
  [loading]="loading()"
  [error]="error()"
  [hasMore]="hasMore()"
  (onLoadMore)="loadMore()"
  (onRetry)="loadMore()"
  (onAdd)="addToCart($event)"
/>
