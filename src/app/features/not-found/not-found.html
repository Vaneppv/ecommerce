<section class="not-found-container" aria-labelledby="not-found-title">
  <div class="not-found-card">
    <div class="icon-wrapper" aria-hidden="true">
      <tabler-icon icon="error-404" [size]="56" />
    </div>

    <h1 id="not-found-title" class="title">Página no encontrada</h1>

    <p class="description">
      Lo sentimos. La dirección a la que intentas acceder no existe o no se encuentra disponible.
    </p>

    <div class="actions">
      <a routerLink="/products" class="btn btn-primary">
        <tabler-icon icon="arrow-left" [size]="18" />
        <span>Volver al catálogo</span>
      </a>
      <a routerLink="/cart" class="btn btn-secondary">
        <tabler-icon icon="shopping-cart" [size]="18" />
        <span>Ver mi carrito</span>
      </a>
    </div>
  </div>
</section>
