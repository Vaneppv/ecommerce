<a class="skip-link" href="#main" (click)="skipToContent($event)">Saltar al contenido</a>

<header class="site-header">
  <div class="topbar">
    <img src="logo-light.png" alt="Click & Store" class="brand-logo" routerLink="/" aria-label="Ir al inicio"/>
    <a class="brand" routerLink="/" aria-label="Ir al inicio">Click & Store</a>

    <div class="topbar-search">
      <app-search-form
        [searchTerm]="searchTerm()"
        placeholder="Buscar productos..."
        buttonVariant="secondary"
        (onSearch)="onSearch($event)"
      />
    </div>

    <nav class="topbar-actions" aria-label="Cuenta y carrito">
      @if (auth.user(); as user) {
        <span class="topbar-user">
          <tabler-icon icon="user" [size]="18" aria-hidden="true" />
          <span class="user-name">Hola, {{ user.name }}</span>
        </span>
        <button
          type="button"
          class="topbar-action"
          aria-label="Cerrar sesión"
          (click)="openLogoutModal()"
        >
          <tabler-icon icon="logout" [size]="18" aria-hidden="true" />
          <span class="topbar-action-label">Cerrar sesión</span>
        </button>
      } @else {
        <a class="topbar-action" routerLink="/login" aria-label="Iniciar sesión">
          <tabler-icon icon="user" [size]="18" aria-hidden="true" />
          <span class="topbar-action-label">Iniciar sesión</span>
        </a>
      }
      <app-cart-badge [count]="cartService.totalCount()" label="Carrito" variant="secondary" />
    </nav>
  </div>

  <nav class="main-nav" aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      <tabler-icon icon="home" [size]="18" />
      <span>Inicio</span>
    </a>
    <a routerLink="/products" routerLinkActive="is-active">
      <tabler-icon icon="layout-grid" [size]="18" />
      <span>Productos</span>
    </a>
    <a routerLink="/" fragment="categorias">
      <tabler-icon icon="category" [size]="18" />
      <span>Categorías</span>
    </a>
  </nav>
</header>

@if (logoutAlert(); as alertMsg) {
  <div class="top-notification-container">
    <app-alert type="info" [message]="alertMsg" [timeout]="5" (onClose)="clearLogoutAlert()" />
  </div>
}

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<app-confirm-dialog
  [open]="isLogoutModalOpen()"
  title="¿Cerrar sesión?"
  message="¿Estás seguro de que deseas salir de tu cuenta? Tendrás que volver a iniciar sesión para acceder a tu perfil."
  confirmText="Cerrar sesión"
  cancelText="Cancelar"
  icon="logout"
  (onConfirm)="confirmLogout()"
  (onCancel)="cancelLogout()"
/>
