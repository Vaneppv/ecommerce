<div class="image-wrapper" [class.loading]="!isLoaded() && !hasError()">
  <img
    [src]="getImageSrc()"
    [alt]="alt()"
    [loading]="loading() ? 'lazy' : 'eager'"
    [title]="alt()"
    [class.loaded]="isLoaded()"
    (load)="handleLoad()"
    (error)="handleError()"
    class="img"
  />
  @if (!isLoaded() && !hasError()) {
    <div class="skeleton-shimmer" aria-hidden="true"></div>
  }
</div>
