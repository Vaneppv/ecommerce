<button
  [disabled]="disabled || loading"
  class="btn [bg-primary text-white rounded px-4 py-2 hover:bg-primary-hover transition-colors flex items-center justify-center]"
  (click)="onClick.emit()"
>
  @if (loading()) {
    <span class="spinner-border spinner-border-sm me-2" role="status">
      <span class="visually-hidden">Cargando...</span>
    </span>Loading...
  } @else {
    <ng-content></ng-content>
  }
</button>
