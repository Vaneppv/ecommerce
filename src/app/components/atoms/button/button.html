<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="'btn ' + variant() + ' ' + size()"
  (click)="onClick.emit()"
>
  @if (loading()) {
    <span class="spinner" role="status" aria-hidden="true"></span>
    <span>Cargando...</span>
  } @else {
    <ng-content></ng-content>
  }
</button>
