<button
  [disabled]="disabled || loading"
  class="btn"
  (click)="onClick.emit()"
>
  @if (loading()) {
    <span class="spinner-border spinner-border-sm me-2" role="status">
      <span class="visually-hidden">Cargando...</span>
    </span>Cargando...
  } @else {
    <ng-content></ng-content>
  }
</button>
