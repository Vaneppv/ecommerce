<div class="product-card">
  <a [routerLink]="['/products', productId()]" class="product-card-image-link">
    <app-image
      [src]="productImage()"
      [alt]="productTitle()"
      [loading]="isFetching()"
      (onLoad)="onImageLoad.emit()"
      (onError)="onImageError.emit($event)"
    ></app-image>
  </a>

  <div class="product-card-content">
    <a [routerLink]="['/products', productId()]" class="product-title-link">
      <h3 class="product-title">{{ productTitle() | titlecase }}</h3>
    </a>
    <p class="product-price">{{ productPrice() | currency }}</p>

    <div class="product-actions">
      <app-button
        variant="primary"
        size="small"
        (onClick)="onAddToCart.emit()"
        [disabled]="isOutOfStock()"
      >
        Añadir al carrito
      </app-button>

      <a
        [routerLink]="['/products', productId()]"
        class="btn-detail"
        title="Ver detalles"
        aria-label="Ver detalles"
      >
        <tabler-icon icon="eye" [size]="14"></tabler-icon>
      </a>
    </div>
  </div>
</div>
