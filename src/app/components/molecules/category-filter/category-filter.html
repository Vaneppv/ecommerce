<div class="category-filter" role="group" aria-label="Filtrar por categoría">
  <button
    type="button"
    class="chip"
    [class.selected]="isAllSelected()"
    (click)="onCategoryChange.emit('')"
  >
    Todas
  </button>

  @for (category of categories(); track category) {
    <button
      type="button"
      class="chip"
      [class.selected]="filteredCategories().includes(category)"
      (click)="onCategoryChange.emit(category)"
    >
      {{ category | titlecase }}
    </button>
  }
</div>
