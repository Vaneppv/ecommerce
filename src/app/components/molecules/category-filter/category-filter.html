<div class="category-filter" role="group" aria-label="Filtro por categorías">
  <button
    type="button"
    class="category-btn"
    [class.selected]="!selectedCategory() || selectedCategory() === 'todas'"
    (click)="onCategoryChange.emit('todas')"
  >
    Todas
  </button>
  @for (category of categories(); track category) {
    <button
      type="button"
      class="category-btn"
      [class.selected]="selectedCategory().toLowerCase() === category.toLowerCase()"
      (click)="onCategoryChange.emit(category)"
    >
      {{ category | titlecase }}
    </button>
  }
</div>
