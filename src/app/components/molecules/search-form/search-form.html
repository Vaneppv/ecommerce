<div class="search-form" role="search">
  <app-input
    type="search"
    [placeholder]="placeholder()"
    [value]="localTerm()"
    (onInput)="handleInput($event)"
    (keydown)="handleKeyDown($event)"
  />

  <app-button [variant]="buttonVariant()" size="small" (onClick)="submit()">Buscar</app-button>
</div>
