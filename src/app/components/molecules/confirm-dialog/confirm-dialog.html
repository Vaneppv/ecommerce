@if (open()) {
  <div class="dialog-backdrop" (click)="cancel()" aria-hidden="true"></div>
  <div
    class="dialog-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
    aria-describedby="dialog-desc"
  >
    <div class="dialog-icon-wrapper" aria-hidden="true">
      <tabler-icon [icon]="icon()" [size]="32" />
    </div>

    <h2 id="dialog-title" class="dialog-title">{{ title() }}</h2>
    <p id="dialog-desc" class="dialog-message">{{ message() }}</p>

    <div class="dialog-actions">
      <app-button variant="ghost" size="medium" (onClick)="cancel()">
        {{ cancelText() }}
      </app-button>
      <app-button [variant]="confirmVariant()" size="medium" (onClick)="confirm()">
        {{ confirmText() }}
      </app-button>
    </div>
  </div>
}
